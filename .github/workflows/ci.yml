name: CI

# Vercel's own GitHub integration builds and deploys every push to main
# independently of this workflow — this is a quality gate, not the deploy
# mechanism. It exists so a broken PR is caught before merge instead of
# being discovered only after Vercel has already deployed it to production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Placeholder values only — nothing in this job ever opens a real
    # database connection or verifies a real token. `prisma validate` reads
    # env("DATABASE_URL") to type-check the datasource block but never
    # connects, and build:noprisma skips `prisma migrate deploy` entirely;
    # PrismaClient itself is lazy and doesn't connect until a query runs,
    # which never happens during a build. env.ts (src/lib/env.ts) still
    # requires these three to be *present* once NODE_ENV=production (which
    # `next build` always sets, regardless of the job's own env) — real
    # secrets live only in Vercel's project env vars, never here.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_ACCESS_SECRET: ci-only-placeholder-not-a-real-secret-0
      JWT_REFRESH_SECRET: ci-only-placeholder-not-a-real-secret-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Schema-only checks — no live database needed, so this job never has
      # to provision a throwaway Postgres service.
      - run: npx prisma generate
      - run: npx prisma validate

      - run: npm run typecheck
      - run: npm run lint

      # build:noprisma (not the default `build` script) deliberately skips
      # `prisma migrate deploy`, which needs a real DATABASE_URL — the same
      # reason this script exists for Vercel preview deployments without a
      # database attached yet (see README's "Deploying" section).
      - run: npm run build:noprisma
