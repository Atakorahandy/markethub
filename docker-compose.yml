# Local PostgreSQL for development — an alternative to the native install
# documented in README.md's "Local database" section for machines that do
# have Docker available.
#   docker compose up -d
#   DATABASE_URL="postgresql://markethub:markethub@localhost:5434/markethub?schema=public"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
      POSTGRES_DB: markethub
    ports:
      - "5434:5432"
    volumes:
      - markethub_pgdata:/var/lib/postgresql/data

volumes:
  markethub_pgdata:
